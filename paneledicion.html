<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Edición | Inventario MARY MARKET</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="h-full flex flex-col font-sans antialiased text-slate-100 bg-slate-900">

    <!-- Verificación de Sesión -->
    <script>
        if (!localStorage.getItem('sys_auth_token')) {
            window.location.href = '/index.html';
        }
    </script>

    <!-- Top Navigation Bar -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/60 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/dashboard.html" class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-300 transition-all" title="Volver al Dashboard">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div>
                    <h1 class="text-base font-bold text-white leading-tight">Panel de Gestión de Inventario</h1>
                    <p class="text-xs text-slate-400">CRUD de Productos & Control de Stock</p>
                </div>
            </div>

            <button onclick="openProductModal()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs sm:text-sm rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>Nuevo Producto</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Tabla CRUD de Productos -->
        <section class="bg-slate-800/80 border border-slate-700/60 rounded-2xl shadow-xl overflow-hidden backdrop-blur-md">
            
            <div class="p-5 border-b border-slate-700/60 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h2 class="text-lg font-bold text-white">Catálogo de Productos</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Agrega, modifica precios/stock o elimina ítems del sistema</p>
                </div>
                <div class="relative w-full sm:w-64">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        oninput="filterTable()" 
                        placeholder="Buscar por código o descripción..." 
                        class="w-full pl-9 pr-4 py-2 bg-slate-900/60 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                    >
                </div>
            </div>

            <!-- Table Wrapper -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/40 text-xs uppercase font-semibold text-slate-400 border-b border-slate-700/60">
                        <tr>
                            <th class="py-3.5 px-5">Código / ID</th>
                            <th class="py-3.5 px-5">Descripción</th>
                            <th class="py-3.5 px-5 text-center">Cantidad</th>
                            <th class="py-3.5 px-5 text-center">Unidad</th>
                            <th class="py-3.5 px-5 text-right">Precio ($)</th>
                            <th class="py-3.5 px-5 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="crudTableBody" class="divide-y divide-slate-700/50 text-xs">
                        <!-- Carga dinámica vía JS -->
                    </tbody>
                </table>
            </div>

        </section>

    </main>

    <!-- Modal Crear / Editar Producto -->
    <div id="productModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 id="modalTitle" class="text-lg font-bold text-white mb-1">Registrar Nuevo Producto</h3>
            <p class="text-xs text-slate-400 mb-6">Ingresa los datos para actualizar el catálogo de inventario</p>
            
            <form id="productForm" onsubmit="saveProduct(event)" class="space-y-4 text-xs">
                <input type="hidden" id="editOriginalId">
                
                <div>
                    <label class="block text-slate-300 font-medium mb-1.5">Código / ID de Producto</label>
                    <input type="text" id="prodId" required placeholder="Ej. PROD-006" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-slate-300 font-medium mb-1.5">Descripción del Producto</label>
                    <input type="text" id="prodDescripcion" required placeholder="Ej. Harina de Maíz Precocida 1kg" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-slate-300 font-medium mb-1.5">Cantidad</label>
                        <input type="number" id="prodCantidad" min="0" required placeholder="0" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-slate-300 font-medium mb-1.5">Unidad</label>
                        <select id="prodUnidad" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Und">Und</option>
                            <option value="Kg">Kg</option>
                            <option value="Lts">Lts</option>
                            <option value="Caja">Caja</option>
                            <option value="Paq">Paq</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-300 font-medium mb-1.5">Precio ($)</label>
                        <input type="number" step="0.01" id="prodPrecio" min="0" required placeholder="0.00" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-700/60 mt-6">
                    <button type="button" onclick="closeProductModal()" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium rounded-xl transition-all">
                        Cancelar
                    </button>
                    <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i>
                        <span>Guardar Producto</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Core App Logic -->
    <script>
        lucide.createIcons();

        // Configuración de cliente Supabase (Reemplazar con tus credenciales)
        const SUPABASE_URL = 'https://jmxxfojwmuyqcwgbrzsv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_94tZU2O9IWTTufhGEavfNg_k72AHddH';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let inventoryData = [];

        // Obtener productos en tiempo real desde Supabase
        async function fetchInventory() {
            try {
                const { data, error } = await supabase
                    .from('productos')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;

                inventoryData = data || [];
                renderTable(inventoryData);
            } catch (err) {
                console.error('Error al consultar inventario en Supabase:', err.message);
                const tbody = document.getElementById('crudTableBody');
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-rose-400">Error al cargar productos desde Supabase.</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('crudTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-500">No se encontraron productos en el inventario.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-800/40 transition-colors";
                row.innerHTML = `
                    <td class="py-3.5 px-5 font-mono text-blue-400 font-medium">${item.id}</td>
                    <td class="py-3.5 px-5 text-white font-medium">${item.descripcion}</td>
                    <td class="py-3.5 px-5 text-center">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${item.cantidad <= 5 ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-slate-700/50 text-slate-200'}">
                            ${item.cantidad}
                        </span>
                    </td>
                    <td class="py-3.5 px-5 text-center text-slate-400">${item.unidad}</td>
                    <td class="py-3.5 px-5 text-right font-mono text-emerald-400">$${parseFloat(item.precio).toFixed(2)}</td>
                    <td class="py-3.5 px-5 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="editProduct('${item.id}')" class="p-1.5 bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 rounded-lg border border-blue-500/20 transition-all" title="Editar">
                                <i data-lucide="pencil" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteProduct('${item.id}')" class="p-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-lg border border-rose-500/20 transition-all" title="Eliminar">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
            lucide.createIcons();
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = inventoryData.filter(i => 
                i.id.toLowerCase().includes(query) || 
                i.descripcion.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        function openProductModal() {
            document.getElementById('productForm').reset();
            document.getElementById('editOriginalId').value = '';
            document.getElementById('modalTitle').innerText = 'Registrar Nuevo Producto';
            document.getElementById('prodId').disabled = false;
            document.getElementById('productModal').classList.remove('hidden');
            document.getElementById('productModal').classList.add('flex');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
            document.getElementById('productModal').classList.remove('flex');
        }

        function editProduct(id) {
            const prod = inventoryData.find(p => p.id === id);
            if (!prod) return;

            document.getElementById('editOriginalId').value = prod.id;
            document.getElementById('prodId').value = prod.id;
            document.getElementById('prodId').disabled = true;
            document.getElementById('prodDescripcion').value = prod.descripcion;
            document.getElementById('prodCantidad').value = prod.cantidad;
            document.getElementById('prodUnidad').value = prod.unidad;
            document.getElementById('prodPrecio').value = prod.precio;

            document.getElementById('modalTitle').innerText = 'Editar Producto';
            document.getElementById('productModal').classList.remove('hidden');
            document.getElementById('productModal').classList.add('flex');
        }

        async function saveProduct(e) {
            e.preventDefault();
            const originalId = document.getElementById('editOriginalId').value;
            const id = document.getElementById('prodId').value.trim();
            const descripcion = document.getElementById('prodDescripcion').value.trim();
            const cantidad = parseInt(document.getElementById('prodCantidad').value);
            const unidad = document.getElementById('prodUnidad').value;
            const precio = parseFloat(document.getElementById('prodPrecio').value);

            try {
                if (originalId) {
                    // Actualización en Supabase
                    const { error } = await supabase
                        .from('productos')
                        .update({ descripcion, cantidad, unidad, precio })
                        .eq('id', originalId);

                    if (error) throw error;
                } else {
                    // Inserción en Supabase
                    const { error } = await supabase
                        .from('productos')
                        .insert([{ id, descripcion, cantidad, unidad, precio }]);

                    if (error) throw error;
                }

                await fetchInventory();
                closeProductModal();
            } catch (err) {
                alert('Error al guardar el producto: ' + err.message);
            }
        }

        async function deleteProduct(id) {
            if (confirm(`¿Estás seguro de eliminar el producto ${id}?`)) {
                try {
                    const { error } = await supabase
                        .from('productos')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;
                    await fetchInventory();
                } catch (err) {
                    alert('Error al eliminar producto: ' + err.message);
                }
            }
        }

        // Inicializar consulta a base de datos
        fetchInventory();
    </script>
</body>
</html>
